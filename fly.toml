app = 'pokedex-lite'
primary_region = 'fra'

[build]

[env]
  PORT = '5001'

[deploy]
  strategy = "canary"

[processes]
  app = 'node app.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
